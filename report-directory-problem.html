<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Report Directory Information | VerifySweep</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui;color:#101010}header{background:#050505;padding:18px 5%}header img{width:220px;max-width:60vw}.wrap{max-width:760px;margin:auto;padding:40px 20px}h1{font-size:clamp(34px,7vw,52px)}label{display:block;font-weight:800;margin:16px 0 6px}select,input,textarea{width:100%;padding:13px;border:1px solid #d8d8d8;border-radius:8px;font:inherit}textarea{min-height:150px}.btn{margin-top:18px;border:0;border-radius:8px;padding:14px 18px;background:#f36b10;color:#fff;font-weight:850}.notice{border-left:5px solid #f36b10;background:#f7f7f7;padding:16px}.hidden{position:absolute;left:-9999px}</style></head><body><header><a href="/"><img src="/VerifySweep-Official-Logo-Black.png" alt="VerifySweep"></a></header><main class="wrap"><p>DIRECTORY CORRECTION</p><h1>Report incorrect information</h1><p id="subject"></p><div class="notice">Reports enter a human-review queue. A report does not automatically remove a listing or change a verification status.</div><form id="form"><label for="reason">Reason</label><select id="reason" required><option value="">Choose a reason</option><option value="person_no_longer_affiliated">Person no longer works there</option><option value="credential_expired">Credential appears expired</option><option value="credential_incorrect">Credential appears incorrect</option><option value="wrong_company">Wrong company</option><option value="wrong_phone">Wrong phone</option><option value="duplicate_profile">Duplicate profile</option><option value="company_closed">Company closed</option><option value="impersonation_concern">Impersonation concern</option><option value="misleading_credential_claim">Misleading credential claim</option><option value="other">Other</option></select><label for="details">What should we review?</label><textarea id="details" maxlength="3000" required></textarea><label for="source">Public source URL (optional)</label><input id="source" type="url"><label for="email">Your email (optional, kept private)</label><input id="email" type="email"><label class="hidden" for="website">Leave blank</label><input class="hidden" id="website" tabindex="-1" autocomplete="off"><button class="btn" type="submit">SUBMIT FOR REVIEW</button><p id="message" role="status"></p></form></main><script>const p=new URLSearchParams(location.search),type=p.get('target_type')||'',id=p.get('target_id')||'',name=p.get('name')||'directory record',form=document.getElementById('form'),message=document.getElementById('message');document.getElementById('subject').textContent='Record: '+name;form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='Submitting…';try{const r=await fetch('/api/directory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'report_problem',target_type:type,target_id:id,reason:reason.value,details:details.value,source_url:source.value,reporter_email:email.value,website:website.value})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Report could not be submitted.');form.reset();message.textContent=d.message}catch(error){message.textContent=error.message||'Report could not be submitted.'}});</script></body></html>
