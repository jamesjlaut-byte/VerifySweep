<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Report Directory Information | VerifySweep</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui;color:#101010}header{background:#050505;padding:18px 5%}header img{width:220px;max-width:60vw}.wrap{max-width:760px;margin:auto;padding:40px 20px}h1{font-size:clamp(34px,7vw,52px)}label{display:block;font-weight:800;margin:16px 0 6px}select,input,textarea{width:100%;padding:13px;border:1px solid #d8d8d8;border-radius:8px;font:inherit}textarea{min-height:150px}.btn{margin-top:18px;border:0;border-radius:8px;padding:14px 18px;background:#f36b10;color:#fff;font-weight:850}.notice{border-left:5px solid #f36b10;background:#f7f7f7;padding:16px}.hidden{position:absolute;left:-9999px}[hidden]{display:none!important}.btn:disabled{opacity:.65;cursor:wait}.receipt{border:2px solid #f36b10;border-radius:12px;padding:20px;margin:20px 0}.receipt a{color:#101010;font-weight:800}.receipt:focus{outline:2px solid #101010}#message:not(:empty){padding:16px;background:#f7f7f7}@media(max-width:600px){.btn{width:100%;min-height:48px}}</style></head><body><header><a href="/"><img src="/VerifySweep-Official-Logo-Black.png" alt="VerifySweep"></a></header><main class="wrap"><p>DIRECTORY CORRECTION</p><h1>Report incorrect information</h1><p id="subject"></p><div class="notice">Reports enter a human-review queue. A report does not automatically remove a listing or change a verification status.</div><form id="form"><label for="reason">Reason</label><select id="reason" required><option value="">Choose a reason</option><option value="person_no_longer_affiliated">Person no longer works there</option><option value="credential_expired">Credential appears expired</option><option value="credential_incorrect">Credential appears incorrect</option><option value="wrong_company">Wrong company</option><option value="
