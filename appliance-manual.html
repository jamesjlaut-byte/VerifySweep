<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101010;background:#f7f7f7}header{height:76px;background:#050505;padding:12px 5%;display:flex;align-items:center;justify-content:space-between}header img{width:220px;max-width:45vw}.btn{border:0;border-radius:8px;padding:12px 15px;font-weight:800;text-decoration:none;background:#f36b10;color:#fff;display:inline-block}.btn.secondary{background:#050505}.btn.outline{background:#fff;color:#101010;border:1px solid #101010}.wrap{max-width:1120px;margin:auto;padding:36px 20px}.back{color:#101010;font-weight:800}.ey{font-size:12px;font-weight:900;letter-spacing:.14em;color:#f36b10}.record-head{background:#fff;border:1px solid #d8d8d8;border-radius:14px;padding:25px;margin-top:17px}.record-head h1{font-size:clamp(32px,5vw,48px);margin:7px 0}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.pill{border:1px solid #d8d8d8;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}.pill.discontinued{background:#101010;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid #d8d8d8;border-radius:14px;padding:22px}.panel h2{margin-top:0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#d8d8d8;border:1px solid #d8d8d8}.fact{background:#fff;padding:13px}.fact b{display:block;font-size:12px;margin-bottom:5px}.unknown{color:#686868;font-weight:700}.documents{display:grid;gap:13px}.document{border:1px solid #d8d8d8;border-radius:12px;padding:18px}.document h3{margin:5px 0}.source{color:#f36b10;font-size:12px;font-weight:900}.docmeta{font-size:13px;color:#555;line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.safety{border-left:4px solid #f36b10;background:#fff;padding:18px;margin-top:20px}.future{background:#050505;color:#fff;border-radius:14px;padding:23px;margin-top:18px}.future p{color:#d8d8d8}.error{background:#fff;border:1px solid #d8d8d8;padding:28px;border-radius:14px}@media(max-width:760px){header{height:65px}.wrap{padding:24px 14px}.grid{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.record-head{padding:19px}.actions .btn{width:100%;text-align:center;min-height:48px}}</style></head><body>
<header><a href="/index.html"><img src="/VerifySweep-Official-Logo-Black.png" alt="VerifySweep"></a><a class="btn secondary" href="/appliance-manual-library.html">Manual Library</a></header><main class="wrap"><a class="back" href="/appliance-manual-library.html">← Back to manual search</a><div id="app"><div class="error">Loading appliance record…</div></div></main>
<script>'use strict';
const app=document.getElementById('app'),id=new URLSearchParams(location.search).get('id');const labels={required_vent_system:'Required Chimney/Vent System',approved_vent_components:'Approved Chimney/Vent Components',flue_vent_size:'Flue/Vent Size',clearance_to_combustibles:'Clearance to Combustibles',mantel_clearance:'Mantel Clearance',trim_clearance:'Trim Clearance',hearth_protection:'Hearth Protection',ember_protection:'Ember Protection',chase_requirements:'Chase Requirements',outside_air_requirements:'Outside Air Requirements',termination_requirements:'Termination Requirements',approved_accessories:'Approved Accessories',replacement_parts:'Replacement Parts Information'};
function el(name,className,text){const node=document.createElement(name);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}function value(v,fallback='NOT DOCUMENTED'){return v===null||v===undefined||v===''?fallback:String(v)}function pill(text,extra=''){return el('span','pill '+extra,text)}
function fact(labelText,valueText){const box=el('div','fact'),b=el('b','',labelText),v=el('span',valueText==='NOT DOCUMENTED'?'unknown':'',valueText);box.append(b,v);return box}
function render(a){document.title=a.manufacturer+' '+a.models[0]+' Manuals | VerifySweep';app.replaceChildren();const head=el('section','record-head');head.append(el('div','ey',a.manufacturer),el('h1','',a.models.join(' / ')),el('div','',value(a.model_family,'MODEL FAMILY NOT DOCUMENTED')));const meta=el('div','meta');meta.append(pill(a.appliance_type),pill(a.fuel_type),pill(a.product_status,a.product_status==='Discontinued'?'discontinued':''));head.append(meta);const grid=el('div','grid');const identity=el('section','panel');identity.append(el('h2','','Appliance identity'));const identityFacts=el('div','facts');[['Manufacturer',a.manufacturer],['Brand',a.brand],['Model Number(s)',a.models.join(', ')],['Model Family',value(a.model_family)],['Approximate Production Years',value(a.production_years)],['Listing Standard',value(a.listing_standard)],['Listing Agency',value(a.listing_agency)],['Product Status',a.product_status]].forEach(([l,v])=>identityFacts.append(fact(l,v)));identity.append(identityFacts);const technical=el('section','panel');technical.append(el('h2','','Documented technical information'));const technicalFacts=el('div','facts');Object.entries(labels).forEach(([key,label])=>technicalFacts.append(fact(label,value((a.technical||{})[key]))));technical.append(technicalFacts);grid.append(identity,technical);const docs=el('section','panel');docs.style.marginTop='18px';docs.append(el('h2','',`Documentation (${(a.documents||[]).length})`));const list=el('div','documents');(a.documents||[]).forEach(d=>{const card=el('article','document');card.append(el('div','source',d.source_type),el('h3','',d.title),el('div','docmeta',`${d.type} · Models: ${(d.models||[]).join(', ')} · Revision: ${value(d.revision)} · Publication: ${value(d.publication_date)} · Added: ${d.date_added} · Last source check: ${d.last_source_check}`));const actions=el('div','actions');const view=el('a','btn','View Manual');view.href='/manual-viewer.html?appliance='+encodeURIComponent(a.id)+'&document='+encodeURIComponent(d.id);const source=el('a','btn secondary','Open Original Source');source.href=d.url;source.target='_blank';source.rel='noopener noreferrer';const download=el('a','btn outline','Download Manual');download.href=d.url;download.target='_blank';download.rel='noopener noreferrer';download.setAttribute('download','');actions.append(view,source,download);card.append(actions);list.append(card)});docs.append(list);const safety=el('aside','safety');safety.append(el('b','','Technical safety notice'),document.createElement('br'),document.createTextNode("Always verify installation requirements against the applicable manufacturer's instructions, listing information, local code requirements, and the specific appliance identification label. The manual itself remains authoritative for manufacturer requirements. Values not established in the catalog are shown as NOT DOCUMENTED."));const future=el('section','future');future.append(el('div','ey','MANUAL SEARCH — COMING SOON'),el('h2','','Ask a question about this manual'),el('p','',"Future answers will be grounded in the selected manual and identify the source manual, page number, relevant section, and source page. No AI technical answer is active, and no specification will be generated without documentation."));app.append(head,grid,docs,safety,future)}
async function load(){if(!id){app.innerHTML='<div class="error"><b>No appliance selected.</b><br>Return to the library and choose an appliance record.</div>';return}try{const response=await fetch('/data/appliance-manuals.json',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json(),record=(data.appliances||[]).find(a=>a.id===id);if(!record)throw new Error('Record not found');render(record)}catch(error){app.replaceChildren();const box=el('div','error');box.append(el('b','','Appliance record unavailable.'),document.createElement('br'),document.createTextNode('Return to the library and try again.'));app.append(box);console.error('Appliance record load failed',error)}}load();
</script></body></html>
