<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manual Viewer | VerifySweep</title><meta name="description" content="View source-identified hearth appliance documentation from the VerifySweep Appliance Manual Library."><meta name="robots" content="noindex,nofollow"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101010;color:#fff}header{min-height:70px;background:#050505;padding:10px 4%;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #444}header img{width:195px;max-width:38vw}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d8d8d8;border-radius:8px;padding:11px 13px;font-weight:800;text-decoration:none;background:#f36b10;color:#fff}.btn.secondary{background:#101010}.info{padding:13px 4%;display:flex;align-items:center;justify-content:space-between;gap:16px}.info h1{font-size:18px;margin:3px 0}.source{font-size:11px;font-weight:900;letter-spacing:.08em;color:#f36b10}.viewer{height:calc(100vh - 145px);background:#fff}.viewer iframe{width:100%;height:100%;border:0}.message{color:#101010;padding:30px}.notice{font-size:12px;color:#d8d8d8;max-width:600px}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1;text-align:center}.info{align-items:flex-start;flex-direction:column}.viewer{height:calc(100vh - 240px);min-height:500px}}</style></head><body><header><a href="/index.html"><img src="/VerifySweep-Official-Logo-Black.png" alt="VerifySweep"></a><div class="actions"><a class="btn secondary" id="back" href="/appliance-manual-library.html">Appliance Record</a><a class="btn" id="original" href="#" target="_blank" rel="noopener noreferrer">Open Original Source</a><a class="btn secondary" id="download" href="#" target="_blank" rel="noopener noreferrer" download>Download Manual</a></div></header><section class="info"><div><div class="source" id="source">LOADING SOURCE</div><h1 id="title">Loading manual…</h1></div><div class="notice">The manufacturer/source manual is authoritative. Verify the specific appliance identification label, listing information, and local code requirements.</div></section><main class="viewer" id="viewer"><div class="message">Loading source document…</div></main><script>'use strict';const params=new URLSearchParams(location.search),applianceId=params.get('appliance'),documentId=params.get('document');async function load(){try{const response=await fetch('/data/appliance-manuals.json',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json(),appliance=(data.appliances||[]).find(a=>a.id===applianceId),doc=appliance&&(appliance.documents||[]).find(d=>d.id===documentId);if(!appliance||!doc)throw new Error('Manual not found');document.title=doc.title+' | VerifySweep';document.getElementById('title').textContent=doc.title;document.getElementById('source').textContent=doc.source_type+' · LAST CHECKED '+doc.last_source_check;document.getElementById('back').href='/appliance-manual.html?id='+encodeURIComponent(appliance.id);['original','download'].forEach(id=>document.getElementById(id).href=doc.url);const frame=document.createElement('iframe');frame.title=doc.title;frame.src=doc.url;document.getElementById('viewer').replaceChildren(frame)}catch(error){document.getElementById('title').textContent='Manual unavailable';document.getElementById('source').textContent='SOURCE COULD NOT BE LOADED';document.getElementById('viewer').textContent='This manual record could not be loaded. Return to the library and try again.';console.error('Manual viewer load failed',error)}}load();</script></body></html>
