<style>
:root{
  --orange:#f36b10;
  --black:#050505;
  --ink:#101010;
  --muted:#626262;
  --white:#ffffff;
  --line:#d8d8d8;
  --light:#f5f5f5;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

html,body{
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:var(--ink);
}

/* HEADER */

.site-header{
  min-height:100px;
  background:var(--black);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 5%;
  position:relative;
  z-index:30;
}

.brand{
  display:block;
  width:340px;
  max-width:70%;
  text-decoration:none;
}

.brand img{
  display:block;
  width:100%;
  height:auto;
}

.menuBtn{
  border:1px solid #555;
  background:transparent;
  color:#fff;
  border-radius:7px;
  width:48px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.hamburger{
  display:flex;
  flex-direction:column;
  gap:5px;
  width:22px;
}

.hamburger i{
  display:block;
  height:2px;
  width:100%;
  background:#fff;
  border-radius:999px;
  transition:.18s ease;
}

.menuBtn[aria-expanded="true"] .hamburger i:nth-child(1){
  transform:translateY(7px) rotate(45deg);
}

.menuBtn[aria-expanded="true"] .hamburger i:nth-child(2){
  opacity:0;
}

.menuBtn[aria-expanded="true"] .hamburger i:nth-child(3){
  transform:translateY(-7px) rotate(-45deg);
}

.menu{
  display:none;
  position:absolute;
  right:5%;
  top:86px;
  background:#090909;
  border:1px solid #333;
  border-radius:10px;
  min-width:310px;
  padding:8px;
  box-shadow:0 15px 35px #0008;
}

.menu.open{
  display:block;
}

.menu a{
  display:block;
  color:#fff;
  text-decoration:none;
  padding:13px 14px;
  border-radius:7px;
  font-weight:700;
}

.menu a:hover{
  background:#202020;
  color:var(--orange);
}

/* AUDIENCE BAR */

.audienceBar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:10px 5%;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-size:12px;
  font-weight:800;
}

.audienceBar b{
  color:var(--orange);
  letter-spacing:.12em;
}

.audienceBar a{
  color:#444;
  text-decoration:none;
}

.audienceBar a:hover{
  color:var(--orange);
}

/* SECTION NAV */

.sectionbar{
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:6px;
  padding:10px 5%;
  overflow-x:auto;
  white-space:nowrap;
}

.sectionbar a{
  color:#333;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
  padding:9px 12px;
  border-radius:8px;
}

.sectionbar a:hover{
  background:#f2f2f2;
  color:var(--orange);
}

/* HERO */

.hero{
  background:var(--black);
  color:#fff;
  padding:72px 6% 78px;
}

.inner,
.wrap{
  max-width:1080px;
  margin:auto;
}

.ey{
  font-size:13px;
  font-weight:900;
  letter-spacing:.14em;
  color:var(--orange);
}

.hero h1{
  font-size:clamp(42px,7vw,70px);
  line-height:1;
  margin:14px 0 20px;
  max-width:900px;
  letter-spacing:-.025em;
}

.hero p{
  font-size:20px;
  line-height:1.65;
  color:#c7c7c7;
  max-width:820px;
}

.heroActions{
  margin-top:28px;
}

.btn{
  display:inline-block;
  background:var(--orange);
  color:#fff;
  text-decoration:none;
  font-weight:900;
  padding:14px 19px;
  border-radius:7px;
  margin:6px 8px 0 0;
}

.btn.alt{
  background:transparent;
  border:1px solid var(--orange);
  color:#fff;
}

/* CONTENT */

.wrap{
  padding:58px 22px;
}

.wrap h2{
  font-size:clamp(30px,4vw,44px);
  line-height:1.08;
  margin:0 0 18px;
}

.wrap h3{
  font-size:23px;
  margin-top:0;
}

.lead{
  font-size:19px;
  line-height:1.7;
  max-width:850px;
}

.muted{
  color:var(--muted);
  line-height:1.7;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin-top:30px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-top:30px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:27px;
}

.card p{
  color:var(--muted);
  line-height:1.65;
}

.number{
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--orange);
  color:#fff;
  font-weight:900;
  margin-bottom:18px;
}

.light{
  background:var(--light);
}

.dark{
  background:var(--black);
  color:#fff;
}

.dark .muted{
  color:#c6c6c6;
}

.dark .card{
  background:#111;
  border-color:#333;
  color:#fff;
}

.dark .card p{
  color:#c6c6c6;
}

.list{
  padding-left:21px;
  line-height:1.8;
}

.list li{
  margin-bottom:8px;
}

.callout{
  margin-top:28px;
  background:#fff;
  border-left:5px solid var(--orange);
  padding:23px 25px;
}

.callout strong{
  color:var(--black);
  font-size:22px;
}

.callout p{
  color:var(--muted);
  line-height:1.65;
  margin-bottom:0;
}

/* CREDENTIAL BOX */

.credentialBox{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  margin-top:30px;
}

.credentialPanel{
  border:1px solid var(--line);
  border-radius:14px;
  padding:27px;
  background:#fff;
}

.credentialPanel h3{
  margin:0 0 12px;
}

.credentialPanel p{
  color:var(--muted);
  line-height:1.65;
}

/* RED FLAGS */

.flag{
  border-left:4px solid var(--orange);
  padding-left:18px;
}

.flag h3{
  margin-bottom:8px;
}

/* FOOTER */

footer{
  padding:38px 6%;
  background:var(--black);
  color:#aaa;
}

footer a{
  color:#ddd;
  text-decoration:none;
  margin-right:16px;
}

footer a:hover{
  color:var(--orange);
}

/* MOBILE */

@media(max-width:800px){

  .grid,
  .grid3,
  .credentialBox{
    grid-template-columns:1fr;
  }

}

@media(max-width:760px){

  .site-header{
    min-height:82px;
    padding:10px 20px;
  }

  .brand{
    width:260px;
    max-width:75%;
  }

  .menu{
    left:5%;
    right:5%;
    top:75px;
    min-width:0;
  }

  .hero{
    padding:55px 22px 62px;
  }

  .hero h1{
    font-size:44px;
  }

  .audienceBar{
    padding:9px 18px;
  }

  .audienceBar a{
    font-size:11px;
    text-align:right;
  }

  .sectionbar{
    padding:8px 14px;
  }

  .sectionbar a{
    font-size:12px;
    padding:8px 10px;
  }

}

@media(max-width:420px){

  .brand{
    width:230px;
  }

  .hero h1{
    font-size:39px;
  }

}
</style>
