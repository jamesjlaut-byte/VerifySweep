<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Claim a Directory Profile | VerifySweep</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui;color:#101010}header{background:#050505;padding:18px 5%}header img{width:220px;max-width:60vw}.wrap{max-width:760px;margin:auto;padding:40px 20px}h1{font-size:clamp(34px,7vw,52px);line-height:1.05}label{display:block;font-weight:800;margin:16px 0 6px}input,textarea{width:100%;padding:13px;border:1px solid #d8d8d8;border-radius:8px;font:inherit}textarea{min-height:150px}.btn{margin-top:18px;border:0;border-radius:8px;padding:14px 18px;background:#f36b10;color:#fff;font-weight:850}.notice{border-left:5px solid #f36b10;background:#f7f7f7;padding:16px}.hidden{position:absolute;left:-9999px}@media(max-width:600px){.wrap{padding:30px 16px}.btn{width:100%;min-height:48px}}
  </style>
</head>
<body>
  <header><a href="/"><img src="/VerifySweep-Official-Logo-Black.png" alt="VerifySweep"></a></header>
  <main class="wrap">
    <p>DIRECTORY PROFILE CLAIM</p>
    <h1>Request access to a profile.</h1>
    <p id="subject"></p>
    <div class="notice"><b>A claim is not verification.</b> Every request receives human review. Approval of profile management does not verify identity, company affiliation, credentials, workmanship, or the company itself.</div>
    <form id="form">
      <label for="claimantName">Your name</label><input id="claimantName" maxlength="160" required>
      <label for="claimantEmail">Business email</label><input id="claimantEmail" type="email" maxlength="320" required>
      <label for="businessPhone">Business phone (optional)</label><input id="businessPhone" type="tel" maxlength="80">
      <label for="evidenceUrl">Public evidence URL (optional)</label><input id="evidenceUrl" type="url" maxlength="1000" placeholder="Company website profile or other public source">
      <label for="details">Explain your connection to this profile</label><textarea id="details" maxlength="3000" required></textarea>
      <label class="hidden" for="website">Leave blank</label><input class="hidden" id="website" tabindex="-1" autocomplete="off">
      <button class="btn" type="submit">SUBMIT CLAIM REQUEST</button><p id="message" role="status"></p>
    </form>
  </main>
  <script>
    const params=new URLSearchParams(location.search),type=params.get('target_type')||'',id=params.get('target_id')||'',name=params.get('name')||'directory profile';
    const form=document.getElementById('form'),message=document.getElementById('message'),claimantName=document.getElementById('claimantName'),claimantEmail=document.getElementById('claimantEmail'),businessPhone=document.getElementById('businessPhone'),evidenceUrl=document.getElementById('evidenceUrl'),details=document.getElementById('details'),website=document.getElementById('website');
    document.getElementById('subject').textContent='Profile: '+name;
    form.addEventListener('submit',async event=>{event.preventDefault();message.textContent='Submitting…';try{const response=await fetch('/api/directory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'claim_profile',target_type:type,target_id:id,claimant_name:claimantName.value,claimant_email:claimantEmail.value,business_phone:businessPhone.value,evidence_url:evidenceUrl.value,details:details.value,website:website.value})}),data=await response.json();if(!response.ok)throw new Error(data.error||'Claim request could not be submitted.');form.reset();message.textContent=data.message}catch(error){message.textContent=error.message||'Claim request could not be submitted.'}});
  </script>
</body>
</html>
