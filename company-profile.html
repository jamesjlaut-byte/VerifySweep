<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Company Profile | VerifySweep</title><meta name="description" content="Review a VerifySweep chimney company directory record and separately identified professional credentials."><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#101010;line-height:1.55}header,footer{background:#050505;color:#fff;padding:20px 6%}header img{display:block;width:220px;max-width:55vw}.wrap{max-width:950px;margin:auto;padding:44px 20px}.ey{font-size:12px;font-weight:900;letter-spacing:.13em;color:#f36b10}h1{font-size:clamp(34px,6vw,54px);margin:8px 0}.status{display:inline-block;border:1px solid #f36b10;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}.card{border:1px solid #d8d8d8;border-radius:14px;padding:22px;margin:16px 0}.person{border-top:1px solid #d8d8d8;padding:18px 0}.person:last-child{padding-bottom:0}.btn{display:inline-block;background:#f36b10;color:#fff;text-decoration:none;font-weight:850;border-radius:8px;padding:12px 15px;margin:6px 6px 0 0}.btn.alt{background:#050505}.muted{color:#555}.notice{border-left:5px solid #f36b10;background:#f7f7f7;padding:17px 19px;margin:20px 0}footer a{color:#fff}@media(max-width:600px){.wrap{padding:34px 16px}.btn{display:block;text-align:center;margin-right:0}}</style></head><body><header><a href="/"><img src="/VerifySweep-Official-Logo-Black.png" alt="VerifySweep"></a></header><main class="wrap" id="profile"><p>Loading company record…</p></main><footer><a href="/directory.html">Company Directory</a> · <a href="/find-a-pro.html">Verified Professionals</a> · <a href="/corrections.html">Corrections</a></footer><script>
const box=document.getElementById('profile');function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}function safeUrl(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch{return''}}function dateText(v){if(!v)return'Not yet reviewed';const d=new Date(v);return Number.isNaN(d.getTime())?'Not yet reviewed':d.toLocaleDateString()}
function render(c){box.replaceChildren();box.append(el('div','COMPANY DIRECTORY RECORD','ey'),el('h1',c.company||'Business name unavailable'),el('span',c.display_status||'UNVERIFIED','status'),el('p',[c.city,c.state,c.zip].filter(Boolean).join(', '),'muted'));const notice=el('div',undefined,'notice');notice.append(el('b','Company status and professional credentials are separate.'),document.createTextNode(' A company record does not mean every technician holds a listed credential. Ask who specifically will perform the work.'));box.append(notice);const info=el('section',undefined,'card');info.append(el('h2','Public business information'),el('p','Source checked: '+dateText(c.last_reviewed_at)));const actions=el('div');const website=safeUrl(c.website);if(website){const a=el('a','Company Website','btn alt');a.href=website;a.target='_blank';a.rel='noopener';actions.append(a)}const publicSource=safeUrl(c.source_url);if(publicSource&&publicSource!==website){const a=el('a','View Listing Source','btn alt');a.href=publicSource;a.target='_blank';a.rel='noopener';actions.append(a)}if(c.phone){const a=el('a','Call Business','btn');a.href='tel:'+String(c.phone).replace(/[^+\d]/g,'');actions.append(a)}info.append(actions,el('p','Inclusion means only that VerifySweep found this public business record. It is not certification, endorsement, or a finding about the company.','muted'));box.append(info);if((c.service_areas||[]).length){const areas=el('section',undefined,'card');areas.append(el('h2','Published service areas'),el('p',c.service_areas.join(', ')));const source=safeUrl(c.service_area_source_url);if(source){const a=el('a','View Service-Area Source','btn alt');a.href=source;a.target='_blank';a.rel='noopener';areas.append(a)}areas.append(el('p','These locations are published by the company as service areas; they are not presented as physical offices.','muted'));box.append(areas)}if(c.history_note){const history=el('section',undefined,'card');history.append(el('div','SOURCE-DOCUMENTED HISTORY','ey'),el('h2','Industry history'),el('p',c.history_note));const source=safeUrl(c.recognition_source_url);if(source){const a=el('a','View History Source','btn alt');a.href=source;a.target='_blank';a.rel='noopener';history.append(a)}history.append(el('p','This factual history note is not a ranking, certification, or endorsement by VerifySweep.','muted'));box.append(history)}const pros=el('section',undefined,'card');pros.append(el('h2','Named professionals in reviewed records'));if(!(c.professionals||[]).length)pros.append(el('p','No named professional credential records are currently associated with this company in VerifySweep. This does not establish that no credentialed professional works there.'));(c.professionals||[]).forEach(p=>{const row=el('article',undefined,'person');row.append(el('h3',p.holder||'Name unavailable'),el('p',(p.issuer?p.issuer+' · ':'')+(p.credential_type||p.credential||'Credential'),'muted'),el('span',p.display_status||'VERIFICATION NEEDED','status'));const source=safeUrl(p.source);if(source){const a=el('a','Verify at Official Source','btn');a.href=source;a.target='_blank';a.rel='noopener';row.append(el('br'),a)}pros.append(row)});box.append(pros)}
(async()=>{const id=new URLSearchParams(location.search).get('id')||'';if(!/^[A-Za-z0-9_-]{1,160}$/.test(id)){box.replaceChildren(el('h1','Company record not found.'));return}try{const r=await fetch('/api/directory?view=companies&id='+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw new Error(d.error||'Company record unavailable.');render(d.result)}catch(e){box.replaceChildren(el('h1','Company record unavailable.'),el('p',e.message||'Try the directory again.'))}})();
</script></body></html>
