<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Company Profile | VerifySweep</title><meta name="description" content="Review a VerifySweep company discovery record, service-area evidence, company claims, and separately verified individual credentials."><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#101010;line-height:1.55}header,footer{background:#050505;color:#fff;padding:20px 6%}header img{display:block;width:220px;max-width:55vw}.wrap{max-width:950px;margin:auto;padding:44px 20px}.ey{font-size:12px;font-weight:900;letter-spacing:.13em;color:#f36b10}h1{font-size:clamp(34px,6vw,54px);margin:8px 0}.status{display:inline-block;border:1px solid #f36b10;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}.card{border:1px solid #d8d8d8;border-radius:14px;padding:22px;margin:16px 0}.row{border-top:1px solid #d8d8d8;padding:16px 0}.row:first-of-type{border-top:0}.btn{display:inline-block;background:#f36b10;color:#fff;text-decoration:none;font-weight:850;border-radius:8px;padding:12px 15px;margin:6px 6px 0 0}.btn.alt{background:#050505}.muted{color:#555}.notice{border-left:5px solid #f36b10;background:#f7f7f7;padding:17px 19px;margin:20px 0}footer a{color:#fff}@media(max-width:600px){.wrap{padding:34px 16px}.btn{display:block;text-align:center;margin-right:0}}</style></head><body><header><a href="/"><img src="/VerifySweep-Official-Logo-Black.png" alt="VerifySweep"></a></header><main class="wrap" id="profile"><p>Loading company record…</p></main><footer><a href="/find-a-pro.html">Find &amp; Verify a Sweep</a> · <a href="/corrections.html">Corrections</a></footer><script>
const box=document.getElementById('profile');function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}function safeUrl(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch{return''}}function dateText(v){if(!v)return'Not yet reviewed';const d=new Date(v);return Number.isNaN(d.getTime())?'Not yet reviewed':d.toLocaleDateString()}function link(label,url,cls='btn alt'){const href=safeUrl(url);if(!href)return null;const a=el('a',label,cls);a.href=href;a.target='_blank';a.rel='noopener';return a}
function render(c){box.replaceChildren();box.append(el('div','COMPANY DISCOVERY RECORD','ey'),el('h1',c.company||'Business name unavailable'),el('span',c.display_status||'UNVERIFIED','status'),el('p','Business location: '+([c.city,c.state,c.zip].filter(Boolean).join(', ')||'Not documented'),'muted'));const notice=el('div',undefined,'notice');notice.append(el('b','Company identity, company claims, and individual credentials are separate.'),document.createTextNode(' Inclusion is not certification or endorsement. Ask who will perform the work and verify that person.'));box.append(notice);
const info=el('section',undefined,'card');info.append(el('h2','Public business information'),el('p','Last reviewed: '+dateText(c.last_reviewed_at)));const site=link('Company Website',c.website);const listing=link('View Listing Source',c.source_url);if(site)info.append(site);if(listing&&safeUrl(c.source_url)!==safeUrl(c.website))info.append(listing);info.append(el('p','This record helps with company discovery only. UNVERIFIED is a neutral status, not a negative finding.','muted'));box.append(info);
const areas=c.service_area_labels||[];if(areas.length){const s=el('section',undefined,'card');s.append(el('div','COMPANY-PUBLISHED EVIDENCE','ey'),el('h2','Service areas'),el('p',areas.join(', ')));const a=link('View Service-Area Source',c.service_area_source_url);if(a)s.append(a);s.append(el('p','These are presented as service areas—not physical offices. Only evidence-backed locations are shown.','muted'));box.append(s)}
const sources=c.sources||[];if(sources.length){const s=el("section",undefined,"card");s.append(el("div","SOURCE TRANSPARENCY","ey"),el("h2","Public sources reviewed"));sources.forEach(source=>{const r=el("div",undefined,"row");r.append(el("b",String(source.type||"public source").replaceAll("_"," ")));const a=link("Open Source",source.url);if(a)r.append(a);s.append(r)});s.append(el("p","A source documents only the information it actually contains; it is not a VerifySweep endorsement.","muted"));box.append(s)}const claims=c.company_claims||[];const claimBox=el('section',undefined,'card');claimBox.append(el('div','UNVERIFIED CLAIMS','ey'),el('h2','Company credential claims'));if(!claims.length)claimBox.append(el('p','No company credential claims are recorded.'));claims.forEach(x=>{const r=el('div',undefined,'row');r.append(el('b',x.claim||'Claim'),el('p','UNVERIFIED CLAIM','status'));const a=link('View Claim Source',x.source_url);if(a)r.append(a);claimBox.append(r)});claimBox.append(el('p','A company claim or logo is not proof that the technician sent to a home holds that credential.','muted'));box.append(claimBox);
const pros=el('section',undefined,'card');pros.append(el('div','INDIVIDUAL VERIFICATION','ey'),el('h2','Named professionals with reviewed credentials'));if(!(c.professionals||[]).length)pros.append(el('p','No named, officially verified individual credential record is currently associated with this company in VerifySweep. This does not establish that no credentialed professional works there.'));(c.professionals||[]).forEach(p=>{const r=el('div',undefined,'row');r.append(el('h3',p.holder||'Name unavailable'),el('p',(p.issuer?p.issuer+' · ':'')+(p.credential_type||p.credential||'Credential'),'muted'),el('span',p.display_status||'VERIFICATION NEEDED','status'));const a=link('Verify at Official Source',p.source,'btn');if(a)r.append(el('br'),a);pros.append(r)});box.append(pros);
const leads=c.professional_candidates||[];if(leads.length){const s=el('section',undefined,'card');s.append(el('div','RESEARCH LEADS — NOT VERIFIED','ey'),el('h2','Names or notes requiring verification'));leads.slice(0,20).forEach(p=>{const r=el('div',undefined,'row');r.append(el('b',p.name_or_note),el('p','VERIFICATION NEEDED','status'));s.append(r)});s.append(el('p','These imported research leads are not displayed as verified credentials.','muted'));box.append(s)}}
(async()=>{const id=new URLSearchParams(location.search).get('id')||'';if(!/^[A-Za-z0-9_-]{1,160}$/.test(id)){box.replaceChildren(el('h1','Company record not found.'));return}try{const r=await fetch('/api/directory?view=companies&id='+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw new Error(d.error||'Company record unavailable.');render(d.result)}catch(e){box.replaceChildren(el('h1','Company record unavailable.'),el('p',e.message||'Try the directory again.'))}})();
</script></body></html>
